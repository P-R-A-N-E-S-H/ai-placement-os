name: AI PlacementOS CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend Quality, Linting & Automated Pytest Suite
  # ============================================================================
  backend-test:
    name: Backend Test & Quality Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        working-directory: ./apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite with Coverage
        working-directory: ./apps/api
        env:
          ENVIRONMENT: testing
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          JWT_SECRET: test_ci_jwt_secret_key_placement_os_32_bytes!
        run: |
          python -m pytest --cov=app --cov-report=term-missing tests/

  # ============================================================================
  # 2. Frontend Build, Typecheck & Static Analysis
  # ============================================================================
  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: TypeScript Typecheck & Lint
        working-directory: ./apps/web
        run: |
          npx tsc --noEmit
          npm run lint --if-present

      - name: Next.js Production Build
        working-directory: ./apps/web
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

  # ============================================================================
  # 3. Docker Image Multi-Stage Build Verification
  # ============================================================================
  docker-build:
    name: Docker Build Verification
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: false
          tags: ai-placementos-api:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: ai-placementos-web:test
