services:
  # ============================================================================
  # 1. PostgreSQL Database with pgvector
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: placementos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-placement_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-placement_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-placement_os_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-placement_user} -d ${POSTGRES_DB:-placement_os_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - placementos_net

  # ============================================================================
  # 2. Redis Distributed Cache & Rate Limiting
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: placementos_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - placementos_net

  # ============================================================================
  # 3. FastAPI Backend Multi-Agent Service
  # ============================================================================
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: placementos_api
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-placement_user}:${POSTGRES_PASSWORD:-placement_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-placement_os_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_placement_os_2026_change_in_prod!}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000", "${FRONTEND_URL:-http://localhost:3000}"]'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - placementos_net

  # ============================================================================
  # 4. Next.js 14 Frontend Web Application
  # ============================================================================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: placementos_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:8000/api/v1
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - placementos_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  placementos_net:
    driver: bridge
